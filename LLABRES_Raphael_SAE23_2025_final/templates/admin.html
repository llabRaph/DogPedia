<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Administration - Backoffice</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Admin Dashboard</div>
        <nav class="nav-links">
            <a href="/accueil">Retour au Site</a>
            <a href="/admin" class="active">Gestion</a>
        </nav>
    </header>

    <main class="admin-wrapper">
        <section class="stats-section">
            <h2>📊 Statistiques des votes</h2>
            <div class="chart-container">
                {{chart_svg}}
            </div>
        </section>

        <section class="crud-section">
            <div class="header-crud">
                <h2>🐕 Base de données des Races</h2>
                
                <form method="GET" action="/admin" class="search-form">
                    <input type="text" name="search" placeholder="Rechercher une race..." value="{{search_value}}">
                    <button type="submit">Rechercher</button>
                </form>
            </div>

            <div class="add-card">
                <h3>+ Ajouter une nouvelle race</h3>
                <form method="POST" action="/admin/add" class="inline-form">
                    <input type="text" name="nomRace" placeholder="Nom de la race" required>
                    <input type="text" name="paysOrigine" placeholder="Pays d'origine">
                    <input type="number" step="0.1" name="tailleMoy" placeholder="Taille (cm)">
                    <input type="number" name="dureeVie" placeholder="Espérance de vie">
                    <input type="text" name="climat" placeholder="Climat propice">
                    <input type="text" name="description" placeholder="Courte description">
                    <button type="submit">Ajouter</button>
                </form>
            </div>

            <table class="crud-table">
                <thead>
                    <tr>
                        <th>ID Alphanumérique</th>
                        <th>Nom Race</th>
                        <th>Pays Origine</th>
                        <th>Taille moy.</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {{crud_table}}
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
